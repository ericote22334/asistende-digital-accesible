<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio - Cocina Escuela</title>

<!--
  ============================================================
  INICIO - ELEGIR EL SISTEMA  (solo HTML y CSS)
  ============================================================
  Cada botón es un enlace <a href="archivo.html"> que abre
  uno de los 3 sistemas.
  IMPORTANTE: este archivo debe estar en la MISMA carpeta que:
    - equipo1_recetario.html
    - equipo2_herramientas.html
    - equipo3_comandera.html
  ============================================================
-->

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #fff8e7;
  color: #333;
  text-align: center;
}

h1 { font-size: 38px; margin: 10px 0 5px; }
.subtitulo { font-size: 22px; margin: 0 0 25px; color: #a0522d; }

.opciones {
  max-width: 600px;
  margin: 0 auto;
}

/* ---------- BOTÓN GRANDE DE CADA SISTEMA ---------- */
.opcion {
  display: block;
  margin-bottom: 20px;
  padding: 25px 20px;
  text-decoration: none;
  color: white;
  border-radius: 25px;
  border: 5px solid #333;
}
.opcion .pictograma { display: block; font-size: 80px; }
.opcion .titulo { display: block; font-size: 30px; font-weight: bold; margin: 5px 0; }
.opcion .detalle { display: block; font-size: 22px; }

.recetario    { background: #e07b39; border-color: #a85520; }
.herramientas { background: #4a90c2; border-color: #2d618a; }
.comandera    { background: #2e8b57; border-color: #1d5c39; }
</style>
</head>

<body>

<h1>🍳 COCINA ESCUELA</h1>
<p class="subtitulo">ELEGÍ UN SISTEMA</p>

<div class="opciones">

  <!-- SISTEMA 1 -->
  <a class="opcion recetario" href="equipo1_recetario.html">
    <span class="pictograma">📖</span>
    <span class="titulo">RECETARIO VISUAL</span>
    <span class="detalle">Prepizzas, Budín de Naranja y Tortafritas</span>
  </a>

  <!-- SISTEMA 2 -->
  <a class="opcion herramientas" href="equipo2_herramientas.html">
    <span class="pictograma">🧯</span>
    <span class="titulo">HERRAMIENTAS Y SEGURIDAD</span>
    <span class="detalle">Balanza, Batidora, Horno y Matafuegos</span>
  </a>

  <!-- SISTEMA 3 -->
  <a class="opcion comandera" href="equipo3_comandera.html">
    <span class="pictograma">📝</span>
    <span class="titulo">COMANDERA</span>
    <span class="detalle">Pedidos del día para el mozo</span>
  </a>

</div>

</body>
</html>
